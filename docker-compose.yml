services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "5001:8080"
    environment:
      - JWT_SECRET=super-secret-key-that-is-at-least-32-bytes-long-for-hs256
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web


